<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Add activity</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#3D6BE0}a:hover{color:#2F5BCB}
button,input{font-family:inherit}
input::placeholder{color:#98A2B3}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #F6F8FB; font-family: 'Geist', 'SF Pro Text', system-ui, sans-serif; color: #172033; -webkit-font-smoothing: antialiased">

  <div style="position: absolute; top: 0; left: 0; right: 0; height: 100px; box-sizing: border-box; padding: 48px 12px 0; display: grid; grid-template-columns: 88px 1fr 88px; align-items: center; background: #F6F8FB">
    <a href="Main.dc.html" style="height: 44px; display: flex; align-items: center; padding: 0 8px; color: #3D6BE0; font-size: 16px; text-decoration: none">Cancel</a>
    <h1 style="margin: 0; text-align: center; font-size: 17px; line-height: 22px; font-weight: 600">New activity</h1>
    <span></span>
  </div>

  <form style="position: absolute; top: 100px; left: 0; right: 0; bottom: 92px; overflow-y: auto; box-sizing: border-box; padding: 12px 20px 32px; display: flex; flex-direction: column; gap: 24px; margin: 0">

    <div style="display: flex; flex-direction: column; gap: 8px">
      <label for="name" style="font-size: 13px; line-height: 16px; font-weight: 500; color: #475467">Activity name</label>
      <input id="name" type="text" placeholder="e.g. Evening walk" style="height: 52px; box-sizing: border-box; padding: 0 16px; border: 1.5px solid #3D6BE0; border-radius: 12px; background: #FFFFFF; font-size: 16px; color: #172033; outline: none; box-shadow: 0 0 0 4px #EDF3FF">
    </div>

    <fieldset style="border: 0; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px">
      <legend style="padding: 0; margin-bottom: 8px; font-size: 13px; line-height: 16px; font-weight: 500; color: #475467">Icon</legend>
      <div style="display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 8px">
        <button type="button" aria-label="Walk" aria-pressed="true" style="height: 48px; border-radius: 12px; border: 1.5px solid #3D6BE0; background: #EDF3FF; color: #3D6BE0; display: flex; align-items: center; justify-content: center; cursor: pointer">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><circle cx="13" cy="4.5" r="1.8"/><path d="M10 21l2-6 3 3v3M8 12l3-4 3 2 3 1M12 15l-1-5"/></svg>
        </button>
        <button type="button" aria-label="Yoga" style="height: 48px; border-radius: 12px; border: 1px solid #E7EBF0; background: #FFFFFF; color: #475467; display: flex; align-items: center; justify-content: center; cursor: pointer">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="5" r="2"/><path d="M12 8v5M6.5 10.5 12 13l5.5-2.5M5 19c2.2-2 4.6-3 7-3s4.8 1 7 3"/></svg>
        </button>
        <button type="button" aria-label="Focus" style="height: 48px; border-radius: 12px; border: 1px solid #E7EBF0; background: #FFFFFF; color: #475467; display: flex; align-items: center; justify-content: center; cursor: pointer">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75"><circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="3"/></svg>
        </button>
        <button type="button" aria-label="Study" style="height: 48px; border-radius: 12px; border: 1px solid #E7EBF0; background: #FFFFFF; color: #475467; display: flex; align-items: center; justify-content: center; cursor: pointer">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linejoin="round"><path d="M4 5.5A1.5 1.5 0 0 1 5.5 4H11v16H5.5A1.5 1.5 0 0 1 4 18.5zM20 5.5A1.5 1.5 0 0 0 18.5 4H13v16h5.5a1.5 1.5 0 0 0 1.5-1.5z"/></svg>
        </button>
        <button type="button" aria-label="Meal" style="height: 48px; border-radius: 12px; border: 1px solid #E7EBF0; background: #FFFFFF; color: #475467; display: flex; align-items: center; justify-content: center; cursor: pointer">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9h13v5a5 5 0 0 1-5 5H9a5 5 0 0 1-5-5zM17 11h1.5a2.5 2.5 0 0 1 0 5H17M8 3v3M12 3v3"/></svg>
        </button>
        <button type="button" aria-label="More icons" style="height: 48px; border-radius: 12px; border: 1px solid #E7EBF0; background: #FFFFFF; color: #475467; display: flex; align-items: center; justify-content: center; cursor: pointer">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><circle cx="5.5" cy="12" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="18.5" cy="12" r="1.6"/></svg>
        </button>
      </div>
    </fieldset>

    <div style="display: flex; flex-direction: column; gap: 8px">
      <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px">
        <div style="display: flex; flex-direction: column; gap: 8px">
          <label for="start" style="font-size: 13px; line-height: 16px; font-weight: 500; color: #475467">Start time</label>
          <input id="start" type="text" value="6:00 PM" style="height: 52px; box-sizing: border-box; padding: 0 16px; border: 1px solid #E7EBF0; border-radius: 12px; background: #FFFFFF; font-size: 16px; color: #172033; font-variant-numeric: tabular-nums">
        </div>
        <div style="display: flex; flex-direction: column; gap: 8px">
          <label for="end" style="font-size: 13px; line-height: 16px; font-weight: 500; color: #475467">End time</label>
          <input id="end" type="text" value="6:30 PM" style="height: 52px; box-sizing: border-box; padding: 0 16px; border: 1px solid #E7EBF0; border-radius: 12px; background: #FFFFFF; font-size: 16px; color: #172033; font-variant-numeric: tabular-nums">
        </div>
      </div>
      <div style="font-size: 13px; line-height: 18px; color: #667085">30 min · fits between Reading and Dinner</div>
    </div>

    <fieldset style="border: 0; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 12px">
      <legend style="padding: 0; margin-bottom: 8px; font-size: 13px; line-height: 16px; font-weight: 500; color: #475467">Repeat</legend>
      <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); padding: 4px; gap: 4px; background: #EEF1F5; border-radius: 12px">
        <button type="button" aria-pressed="true" style="height: 40px; border: 0; border-radius: 9px; background: #FFFFFF; box-shadow: 0 1px 2px rgba(16,24,40,0.06); color: #172033; font-size: 14px; font-weight: 600; cursor: pointer">Daily</button>
        <button type="button" style="height: 40px; border: 0; border-radius: 9px; background: transparent; color: #667085; font-size: 14px; font-weight: 500; cursor: pointer">Weekdays</button>
        <button type="button" style="height: 40px; border: 0; border-radius: 9px; background: transparent; color: #667085; font-size: 14px; font-weight: 500; cursor: pointer">Custom</button>
      </div>
      <div style="display: flex; justify-content: space-between">
        <button type="button" aria-label="Monday" aria-pressed="true" style="width: 44px; height: 44px; border-radius: 50%; border: 0; background: #3D6BE0; color: #FFFFFF; font-size: 14px; font-weight: 600; cursor: pointer">M</button>
        <button type="button" aria-label="Tuesday" aria-pressed="true" style="width: 44px; height: 44px; border-radius: 50%; border: 0; background: #3D6BE0; color: #FFFFFF; font-size: 14px; font-weight: 600; cursor: pointer">T</button>
        <button type="button" aria-label="Wednesday" aria-pressed="true" style="width: 44px; height: 44px; border-radius: 50%; border: 0; background: #3D6BE0; color: #FFFFFF; font-size: 14px; font-weight: 600; cursor: pointer">W</button>
        <button type="button" aria-label="Thursday" aria-pressed="true" style="width: 44px; height: 44px; border-radius: 50%; border: 0; background: #3D6BE0; color: #FFFFFF; font-size: 14px; font-weight: 600; cursor: pointer">T</button>
        <button type="button" aria-label="Friday" aria-pressed="true" style="width: 44px; height: 44px; border-radius: 50%; border: 0; background: #3D6BE0; color: #FFFFFF; font-size: 14px; font-weight: 600; cursor: pointer">F</button>
        <button type="button" aria-label="Saturday" aria-pressed="true" style="width: 44px; height: 44px; border-radius: 50%; border: 0; background: #3D6BE0; color: #FFFFFF; font-size: 14px; font-weight: 600; cursor: pointer">S</button>
        <button type="button" aria-label="Sunday" aria-pressed="true" style="width: 44px; height: 44px; border-radius: 50%; border: 0; background: #3D6BE0; color: #FFFFFF; font-size: 14px; font-weight: 600; cursor: pointer">S</button>
      </div>
    </fieldset>

    <fieldset style="border: 0; margin: 0; padding: 0; display: flex; flex-direction: column">
      <legend style="padding: 0; margin-bottom: 8px; font-size: 13px; line-height: 16px; font-weight: 500; color: #475467">Reminders</legend>
      <div style="background: #FFFFFF; border: 1px solid #E7EBF0; border-radius: 16px; padding: 0 16px">
        <div style="min-height: 56px; display: flex; align-items: center; justify-content: space-between; gap: 12px; border-bottom: 1px solid #EEF1F5">
          <span style="font-size: 15px; line-height: 20px">Notify at start</span>
          <button type="button" role="switch" aria-checked="true" aria-label="Notify at start" style="width: 48px; height: 28px; border: 0; padding: 2px; border-radius: 999px; background: #3D6BE0; display: flex; justify-content: flex-end; cursor: pointer"><span style="width: 24px; height: 24px; border-radius: 50%; background: #FFFFFF; box-shadow: 0 1px 2px rgba(16,24,40,0.2)"></span></button>
        </div>
        <div style="min-height: 64px; display: flex; align-items: center; justify-content: space-between; gap: 12px; border-bottom: 1px solid #EEF1F5">
          <span style="display: flex; flex-direction: column"><span style="font-size: 15px; line-height: 20px">Notify before end</span><span style="font-size: 13px; line-height: 18px; color: #667085">10 min before</span></span>
          <button type="button" role="switch" aria-checked="true" aria-label="Notify before end" style="width: 48px; height: 28px; border: 0; padding: 2px; border-radius: 999px; background: #3D6BE0; display: flex; justify-content: flex-end; cursor: pointer"><span style="width: 24px; height: 24px; border-radius: 50%; background: #FFFFFF; box-shadow: 0 1px 2px rgba(16,24,40,0.2)"></span></button>
        </div>
        <div style="min-height: 64px; display: flex; align-items: center; justify-content: space-between; gap: 12px">
          <span style="display: flex; flex-direction: column"><span style="font-size: 15px; line-height: 20px">Ask if missed</span><span style="font-size: 13px; line-height: 18px; color: #667085">A quick check-in when it ends</span></span>
          <button type="button" role="switch" aria-checked="true" aria-label="Ask if missed" style="width: 48px; height: 28px; border: 0; padding: 2px; border-radius: 999px; background: #3D6BE0; display: flex; justify-content: flex-end; cursor: pointer"><span style="width: 24px; height: 24px; border-radius: 50%; background: #FFFFFF; box-shadow: 0 1px 2px rgba(16,24,40,0.2)"></span></button>
        </div>
      </div>
    </fieldset>

    <button type="button" style="min-height: 48px; border: 0; background: transparent; padding: 0; display: flex; align-items: center; justify-content: space-between; color: #475467; font-size: 15px; cursor: pointer">
      More options
      <span style="display: flex; align-items: center; gap: 6px; color: #667085; font-size: 13px">Notes, colour, goal <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg></span>
    </button>
  </form>

  <div style="position: absolute; left: 0; right: 0; bottom: 0; box-sizing: border-box; padding: 12px 20px 32px; background: #F6F8FB; border-top: 1px solid #E7EBF0">
    <button type="button" style="width: 100%; height: 52px; border: 0; border-radius: 12px; background: #3D6BE0; color: #FFFFFF; font-size: 16px; font-weight: 600; cursor: pointer">Create activity</button>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
