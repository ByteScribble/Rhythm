<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Edit activity</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#3D6BE0}a:hover{color:#2F5BCB}
button,input{font-family:inherit}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #F6F8FB; font-family: 'Geist', 'SF Pro Text', system-ui, sans-serif; color: #172033; -webkit-font-smoothing: antialiased">

  <div style="position: absolute; top: 0; left: 0; right: 0; height: 100px; box-sizing: border-box; padding: 48px 12px 0; display: grid; grid-template-columns: 88px 1fr 88px; align-items: center">
    <a href="Routine.dc.html" style="height: 44px; display: flex; align-items: center; padding: 0 8px; color: #3D6BE0; font-size: 16px; text-decoration: none">Cancel</a>
    <h1 style="margin: 0; text-align: center; font-size: 17px; line-height: 22px; font-weight: 600">Edit activity</h1>
    <span></span>
  </div>

  <form style="position: absolute; top: 100px; left: 0; right: 0; bottom: 92px; overflow-y: auto; box-sizing: border-box; padding: 12px 20px 32px; display: flex; flex-direction: column; gap: 24px; margin: 0">

    <div style="display: flex; align-items: center; gap: 14px; padding: 16px; background: #FFFFFF; border: 1px solid #E7EBF0; border-radius: 16px">
      <div style="width: 44px; height: 44px; border-radius: 12px; background: #EDF3FF; color: #3D6BE0; display: flex; align-items: center; justify-content: center">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75"><circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="3"/></svg>
      </div>
      <div style="flex: 1; display: flex; flex-direction: column">
        <span style="font-size: 13px; line-height: 18px; color: #667085">This week</span>
        <span style="font-size: 15px; line-height: 22px; font-weight: 500">Completed 4 of 5 <span style="color: #667085; font-weight: 400">· 80%</span></span>
      </div>
      <button type="button" aria-label="Change icon" style="height: 44px; padding: 0 12px; border: 0; background: transparent; color: #3D6BE0; font-size: 14px; font-weight: 500; cursor: pointer">Change icon</button>
    </div>

    <div style="display: flex; flex-direction: column; gap: 8px">
      <label for="ename" style="font-size: 13px; line-height: 16px; font-weight: 500; color: #475467">Activity name</label>
      <input id="ename" type="text" value="Deep work" style="height: 52px; box-sizing: border-box; padding: 0 16px; border: 1px solid #E7EBF0; border-radius: 12px; background: #FFFFFF; font-size: 16px; color: #172033">
    </div>

    <div style="display: flex; flex-direction: column; gap: 8px">
      <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px">
        <div style="display: flex; flex-direction: column; gap: 8px">
          <label for="es" style="font-size: 13px; line-height: 16px; font-weight: 500; color: #475467">Start time</label>
          <input id="es" type="text" value="8:00 AM" style="height: 52px; box-sizing: border-box; padding: 0 16px; border: 1px solid #E7EBF0; border-radius: 12px; background: #FFFFFF; font-size: 16px; color: #172033; font-variant-numeric: tabular-nums">
        </div>
        <div style="display: flex; flex-direction: column; gap: 8px">
          <label for="ee" style="font-size: 13px; line-height: 16px; font-weight: 500; color: #475467">End time</label>
          <input id="ee" type="text" value="10:00 AM" style="height: 52px; box-sizing: border-box; padding: 0 16px; border: 1.5px solid #3D6BE0; border-radius: 12px; background: #FFFFFF; font-size: 16px; color: #172033; font-variant-numeric: tabular-nums; box-shadow: 0 0 0 4px #EDF3FF; outline: none">
        </div>
      </div>
      <div style="font-size: 13px; line-height: 18px; color: #667085">2 hr · Break follows at 10:00 AM</div>
    </div>

    <fieldset style="border: 0; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 12px">
      <legend style="padding: 0; margin-bottom: 8px; font-size: 13px; line-height: 16px; font-weight: 500; color: #475467">Repeat</legend>
      <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); padding: 4px; gap: 4px; background: #EEF1F5; border-radius: 12px">
        <button type="button" style="height: 40px; border: 0; border-radius: 9px; background: transparent; color: #667085; font-size: 14px; font-weight: 500; cursor: pointer">Daily</button>
        <button type="button" aria-pressed="true" style="height: 40px; border: 0; border-radius: 9px; background: #FFFFFF; box-shadow: 0 1px 2px rgba(16,24,40,0.06); color: #172033; font-size: 14px; font-weight: 600; cursor: pointer">Weekdays</button>
        <button type="button" style="height: 40px; border: 0; border-radius: 9px; background: transparent; color: #667085; font-size: 14px; font-weight: 500; cursor: pointer">Custom</button>
      </div>
      <div style="display: flex; justify-content: space-between">
        <button type="button" aria-label="Monday" aria-pressed="true" style="width: 44px; height: 44px; border-radius: 50%; border: 0; background: #3D6BE0; color: #FFFFFF; font-size: 14px; font-weight: 600; cursor: pointer">M</button>
        <button type="button" aria-label="Tuesday" aria-pressed="true" style="width: 44px; height: 44px; border-radius: 50%; border: 0; background: #3D6BE0; color: #FFFFFF; font-size: 14px; font-weight: 600; cursor: pointer">T</button>
        <button type="button" aria-label="Wednesday" aria-pressed="true" style="width: 44px; height: 44px; border-radius: 50%; border: 0; background: #3D6BE0; color: #FFFFFF; font-size: 14px; font-weight: 600; cursor: pointer">W</button>
        <button type="button" aria-label="Thursday" aria-pressed="true" style="width: 44px; height: 44px; border-radius: 50%; border: 0; background: #3D6BE0; color: #FFFFFF; font-size: 14px; font-weight: 600; cursor: pointer">T</button>
        <button type="button" aria-label="Friday" aria-pressed="true" style="width: 44px; height: 44px; border-radius: 50%; border: 0; background: #3D6BE0; color: #FFFFFF; font-size: 14px; font-weight: 600; cursor: pointer">F</button>
        <button type="button" aria-label="Saturday" aria-pressed="false" style="width: 44px; height: 44px; border-radius: 50%; border: 1px solid #E7EBF0; background: #FFFFFF; color: #667085; font-size: 14px; font-weight: 500; cursor: pointer">S</button>
        <button type="button" aria-label="Sunday" aria-pressed="false" style="width: 44px; height: 44px; border-radius: 50%; border: 1px solid #E7EBF0; background: #FFFFFF; color: #667085; font-size: 14px; font-weight: 500; cursor: pointer">S</button>
      </div>
    </fieldset>

    <fieldset style="border: 0; margin: 0; padding: 0; display: flex; flex-direction: column">
      <legend style="padding: 0; margin-bottom: 8px; font-size: 13px; line-height: 16px; font-weight: 500; color: #475467">Reminders</legend>
      <div style="background: #FFFFFF; border: 1px solid #E7EBF0; border-radius: 16px; padding: 0 16px">
        <div style="min-height: 56px; display: flex; align-items: center; justify-content: space-between; gap: 12px; border-bottom: 1px solid #EEF1F5">
          <span style="font-size: 15px; line-height: 20px">Notify at start</span>
          <button type="button" role="switch" aria-checked="true" aria-label="Notify at start" style="width: 48px; height: 28px; border: 0; padding: 2px; border-radius: 999px; background: #3D6BE0; display: flex; justify-content: flex-end; cursor: pointer"><span style="width: 24px; height: 24px; border-radius: 50%; background: #FFFFFF; box-shadow: 0 1px 2px rgba(16,24,40,0.2)"></span></button>
        </div>
        <div style="min-height: 56px; display: flex; align-items: center; justify-content: space-between; gap: 12px; border-bottom: 1px solid #EEF1F5">
          <span style="font-size: 15px; line-height: 20px">Notify before end</span>
          <button type="button" role="switch" aria-checked="false" aria-label="Notify before end" style="width: 48px; height: 28px; border: 0; padding: 2px; border-radius: 999px; background: #D5DAE1; display: flex; justify-content: flex-start; cursor: pointer"><span style="width: 24px; height: 24px; border-radius: 50%; background: #FFFFFF; box-shadow: 0 1px 2px rgba(16,24,40,0.2)"></span></button>
        </div>
        <div style="min-height: 56px; display: flex; align-items: center; justify-content: space-between; gap: 12px">
          <span style="font-size: 15px; line-height: 20px">Ask if missed</span>
          <button type="button" role="switch" aria-checked="true" aria-label="Ask if missed" style="width: 48px; height: 28px; border: 0; padding: 2px; border-radius: 999px; background: #3D6BE0; display: flex; justify-content: flex-end; cursor: pointer"><span style="width: 24px; height: 24px; border-radius: 50%; background: #FFFFFF; box-shadow: 0 1px 2px rgba(16,24,40,0.2)"></span></button>
        </div>
      </div>
    </fieldset>

    <div style="display: flex; flex-direction: column; align-items: center; gap: 4px; padding-top: 4px">
      <button type="button" style="height: 44px; padding: 0 16px; border: 0; background: transparent; color: #B9474D; font-size: 15px; font-weight: 500; cursor: pointer">Delete activity</button>
      <span style="font-size: 13px; line-height: 18px; color: #667085">Past history is kept either way.</span>
    </div>
  </form>

  <div style="position: absolute; left: 0; right: 0; bottom: 0; box-sizing: border-box; padding: 12px 20px 32px; background: #F6F8FB; border-top: 1px solid #E7EBF0; display: flex; flex-direction: column; gap: 8px">
    <button type="button" style="width: 100%; height: 52px; border: 0; border-radius: 12px; background: #3D6BE0; color: #FFFFFF; font-size: 16px; font-weight: 600; cursor: pointer">Save changes</button>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
