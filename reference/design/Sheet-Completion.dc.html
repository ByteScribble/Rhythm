<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Activity completion sheet</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#3D6BE0}a:hover{color:#2F5BCB}
button,input{font-family:inherit}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
@keyframes blink{0%,90%,100%{transform:scaleY(1)}94%{transform:scaleY(.1)}}
@keyframes tilt{0%,100%{transform:rotate(0)}25%{transform:rotate(-7deg)}75%{transform:rotate(5deg)}}
@keyframes droop{0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(2px) rotate(-4deg)}}
@keyframes tear{0%{transform:translateY(0);opacity:0}20%{opacity:1}80%{transform:translateY(9px);opacity:1}100%{transform:translateY(11px);opacity:0}}
@keyframes talk{0%,100%{transform:scaleY(1)}50%{transform:scaleY(.35)}}
.b-bob{animation:bob 3s ease-in-out infinite}
.b-tilt{animation:tilt 2.4s ease-in-out infinite;transform-origin:50% 90%}
.b-droop{animation:droop 3.2s ease-in-out infinite;transform-origin:50% 90%}
.b-eyes{animation:blink 4s infinite;transform-box:fill-box;transform-origin:center}
.b-talk{animation:talk 180ms ease-in-out 1.2s 10 alternate;transform-box:fill-box;transform-origin:center}
.b-tear{animation:tear 2.2s ease-in infinite}
@media (prefers-reduced-motion:reduce){.b-bob,.b-tilt,.b-droop,.b-eyes,.b-talk,.b-tear{animation:none}}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #F6F8FB; font-family: 'Geist', 'SF Pro Text', system-ui, sans-serif; color: #172033; -webkit-font-smoothing: antialiased">

  <div aria-hidden="true" style="position: absolute; inset: 0; box-sizing: border-box; padding: 56px 20px 0; display: flex; flex-direction: column; gap: 28px">
    <div style="display: flex; flex-direction: column; gap: 2px">
      <div style="font-size: 14px; line-height: 20px; color: #667085">Good morning</div>
      <div style="font-size: 28px; line-height: 34px; font-weight: 600; letter-spacing: -0.02em">Today</div>
      <div style="font-size: 14px; line-height: 20px; color: #667085">Sunday, 4 October</div>
    </div>
    <div style="display: flex; flex-direction: column; gap: 12px">
      <div style="font-size: 13px; line-height: 16px; font-weight: 600; letter-spacing: 0.06em; color: #667085">NOW</div>
      <div style="background: #FFFFFF; border: 1px solid #E7EBF0; border-radius: 20px; padding: 20px; display: flex; flex-direction: column; gap: 20px">
        <div style="display: flex; align-items: center; gap: 14px">
          <div style="width: 44px; height: 44px; border-radius: 12px; background: #EDF3FF"></div>
          <div style="display: flex; flex-direction: column; gap: 2px">
            <div style="font-size: 22px; line-height: 28px; font-weight: 600">Yoga</div>
            <div style="font-size: 14px; line-height: 20px; color: #667085">6:00 AM – 7:00 AM</div>
          </div>
        </div>
        <div style="height: 4px; border-radius: 999px; background: #EEF1F5"><div style="width: 38%; height: 100%; border-radius: 999px; background: #3D6BE0"></div></div>
        <div style="display: flex; gap: 8px">
          <div style="flex: 1; height: 48px; border-radius: 12px; background: #3D6BE0"></div>
          <div style="width: 92px; height: 48px; border-radius: 12px; border: 1px solid #E7EBF0; box-sizing: border-box"></div>
        </div>
      </div>
    </div>
  </div>

  <div style="position: absolute; inset: 0; background: rgba(23,32,51,0.32)"></div>

  <div role="dialog" aria-label="How did Yoga go?" style="position: absolute; left: 0; right: 0; bottom: 0; background: #FFFFFF; border-radius: 28px 28px 0 0; padding: 8px 20px 28px; box-shadow: 0 -8px 32px rgba(16,24,40,0.08); display: flex; flex-direction: column; gap: 20px">
    <div style="width: 36px; height: 4px; border-radius: 999px; background: #D5DAE1; align-self: center"></div>
    <div style="display: flex; align-items: center; gap: 14px">
      <span class="b-tilt" style="display: block; width: 52px; height: 52px; flex-shrink: 0"><svg width="52" height="52" viewBox="0 0 56 56" aria-hidden="true"><circle cx="28" cy="28" r="25" fill="#FCF3E3" stroke="#DFA247" stroke-width="1.5"/><path d="M32 18.5 Q35.5 16.5 39 18.5" fill="none" stroke="#172033" stroke-width="2" stroke-linecap="round"/><g class="b-eyes"><ellipse cx="21" cy="25.5" rx="2.6" ry="3.2" fill="#172033"/><ellipse cx="35" cy="24.5" rx="2.6" ry="3.4" fill="#172033"/></g><path class="b-talk" d="M21 35 Q28 38.5 35 33" fill="none" stroke="#172033" stroke-width="2.2" stroke-linecap="round"/></svg></span>
      <div style="display: flex; flex-direction: column; gap: 2px">
        <h2 style="margin: 0; font-size: 20px; line-height: 26px; font-weight: 600">How did Yoga go?</h2>
        <div style="font-size: 14px; line-height: 20px; color: #667085; font-variant-numeric: tabular-nums">Some is better than none — tell me how much?</div>
      </div>
    </div>

    <div role="radiogroup" aria-label="Outcome" style="display: flex; flex-direction: column; gap: 8px">
      <button type="button" style="min-height: 60px; padding: 0 16px; border: 1px solid #E7EBF0; border-radius: 14px; background: #FFFFFF; display: flex; align-items: center; gap: 14px; text-align: left; color: #172033; cursor: pointer">
        <span class="b-bob" style="display:block;width:36px;height:36px;flex-shrink:0"><svg width="36" height="36" viewBox="0 0 56 56" aria-hidden="true"><circle cx="28" cy="28" r="25" fill="#EAF6EF" stroke="#34A36F" stroke-width="2"/><path d="M16.5 26 Q20.5 20.5 24.5 26" fill="none" stroke="#172033" stroke-width="3" stroke-linecap="round"/><path d="M31.5 26 Q35.5 20.5 39.5 26" fill="none" stroke="#172033" stroke-width="3" stroke-linecap="round"/><circle cx="14.5" cy="32.5" r="3" fill="#F4B4B8" opacity="0.8"/><circle cx="41.5" cy="32.5" r="3" fill="#F4B4B8" opacity="0.8"/><path d="M19 32 Q28 45 37 32 Z" fill="#172033"/></svg></span>
        <span style="display: flex; flex-direction: column"><span style="font-size: 16px; line-height: 22px; font-weight: 500">Completed</span><span style="font-size: 13px; line-height: 18px; color: #667085">Finished as planned</span></span>
      </button>
      <button type="button" aria-pressed="true" style="min-height: 60px; padding: 0 16px; border: 1.5px solid #DFA247; border-radius: 14px; background: #FFFBF3; display: flex; align-items: center; gap: 14px; text-align: left; color: #172033; cursor: pointer">
        <span class="b-tilt" style="display:block;width:36px;height:36px;flex-shrink:0"><svg width="36" height="36" viewBox="0 0 56 56" aria-hidden="true"><circle cx="28" cy="28" r="25" fill="#FCF3E3" stroke="#DFA247" stroke-width="2"/><path d="M32 18.5 Q35.5 16.5 39 18.5" fill="none" stroke="#172033" stroke-width="2.5" stroke-linecap="round"/><g class="b-eyes"><ellipse cx="21" cy="25.5" rx="3" ry="3.6" fill="#172033"/><ellipse cx="35" cy="24.5" rx="3" ry="3.8" fill="#172033"/></g><path d="M21 35 Q28 38.5 35 33" fill="none" stroke="#172033" stroke-width="3" stroke-linecap="round"/></svg></span>
        <span style="flex: 1; display: flex; flex-direction: column"><span style="font-size: 16px; line-height: 22px; font-weight: 500">Partially completed</span><span style="font-size: 13px; line-height: 18px; color: #667085">Did some of it — that counts</span></span>
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#A86A12" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>
      </button>
      <button type="button" style="min-height: 60px; padding: 0 16px; border: 1px solid #E7EBF0; border-radius: 14px; background: #FFFFFF; display: flex; align-items: center; gap: 14px; text-align: left; color: #172033; cursor: pointer">
        <span style="display:block;width:36px;height:36px;flex-shrink:0"><svg width="36" height="36" viewBox="0 0 56 56" aria-hidden="true"><circle cx="28" cy="28" r="25" fill="#F1F4F8" stroke="#98A2B3" stroke-width="2"/><path d="M17.5 26.5 Q21 29 24.5 26.5" fill="none" stroke="#172033" stroke-width="3" stroke-linecap="round"/><path d="M31.5 26.5 Q35 29 38.5 26.5" fill="none" stroke="#172033" stroke-width="3" stroke-linecap="round"/><path d="M22 36 H34" fill="none" stroke="#172033" stroke-width="3" stroke-linecap="round"/></svg></span>
        <span style="display: flex; flex-direction: column"><span style="font-size: 16px; line-height: 22px; font-weight: 500">Skipped</span><span style="font-size: 13px; line-height: 18px; color: #667085">Not today</span></span>
      </button>
    </div>

    <div style="display: flex; flex-direction: column; gap: 8px">
      <div style="font-size: 13px; line-height: 16px; font-weight: 500; color: #475467">How much did you do? <span style="color: #667085; font-weight: 400">Optional</span></div>
      <div style="display: flex; gap: 8px">
        <button type="button" style="flex: 1; height: 44px; border: 1px solid #E7EBF0; border-radius: 12px; background: #FFFFFF; color: #172033; font-size: 14px; cursor: pointer">25%</button>
        <button type="button" aria-pressed="true" style="flex: 1; height: 44px; border: 1.5px solid #3D6BE0; border-radius: 12px; background: #EDF3FF; color: #2F5BCB; font-size: 14px; font-weight: 600; cursor: pointer">50%</button>
        <button type="button" style="flex: 1; height: 44px; border: 1px solid #E7EBF0; border-radius: 12px; background: #FFFFFF; color: #172033; font-size: 14px; cursor: pointer">75%</button>
      </div>
      <input id="note" type="text" aria-label="Note" placeholder="Add a note" style="height: 48px; box-sizing: border-box; padding: 0 14px; border: 1px solid #E7EBF0; border-radius: 12px; background: #F9FAFC; font-size: 15px; color: #172033; outline: none">
    </div>

    <div style="display: flex; gap: 8px">
      <button type="button" style="height: 48px; padding: 0 20px; border: 0; border-radius: 12px; background: transparent; color: #667085; font-size: 15px; font-weight: 500; cursor: pointer">Cancel</button>
      <button type="button" style="flex: 1; height: 48px; border: 0; border-radius: 12px; background: #3D6BE0; color: #FFFFFF; font-size: 16px; font-weight: 600; cursor: pointer">Save as partial</button>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
